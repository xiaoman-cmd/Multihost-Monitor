server {
    listen 80;
    server_name monitor.appcratehq.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name monitor.appcratehq.com;
    ssl_certificate /etc/letsencrypt/live/monitor.appcratehq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.appcratehq.com/privkey.pem;

    location / {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:18080;
    }
}
