[project]
name = "multihost-monitor"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1,<26", "argon2-cffi-bindings>=21.2,<26"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["server/tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
